<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corneteiro — Cartola FC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#fff7ed",
                100: "#ffedd5",
                200: "#fed7aa",
                400: "#fb923c",
                500: "#f97316",
                600: "#ea580c",
                700: "#c2410c",
                900: "#7c2d12",
              },
              ink: {
                900: "#0b0f14",
                800: "#111827",
                700: "#1f2937",
                600: "#374151",
                500: "#4b5563",
                400: "#6b7280",
                200: "#e5e7eb",
                100: "#f3f4f6",
                50: "#f9fafb",
              },
            },
            fontFamily: {
              sans: [
                "Inter",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <style>
      html {
        font-family: "Inter", system-ui, sans-serif;
      }
      .tab-btn[aria-selected="true"] {
        background-color: #111827;
        color: #fff;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #e5e7eb;
        border-top-color: #ea580c;
        border-radius: 9999px;
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      [data-view] {
        display: none;
      }
      [data-view].is-active {
        display: block;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        background: #f3f4f6;
        color: #1f2937;
      }
      .chip-green {
        background: #dcfce7;
        color: #166534;
      }
      .chip-red {
        background: #fee2e2;
        color: #991b1b;
      }
      .chip-amber {
        background: #fef3c7;
        color: #92400e;
      }
    </style>
  </head>
  <body class="bg-ink-50 text-ink-800 min-h-screen">
    <header class="bg-white border-b border-ink-200 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
        <div class="flex items-center gap-2">
          <div
            class="w-8 h-8 rounded-lg bg-brand-600 text-white grid place-items-center font-black"
          >
            C
          </div>
          <div>
            <div class="font-bold leading-tight">Corneteiro</div>
            <div class="text-[11px] text-ink-400 leading-tight">
              Cartola FC · Escalações inteligentes
            </div>
          </div>
        </div>
        <nav class="flex items-center gap-1 ml-auto" id="nav-tabs">
          <button
            class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-ink-100"
            data-route="#/recomendacoes"
            aria-selected="true"
          >
            Recomendações
          </button>
          <button
            class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-ink-100"
            data-route="#/atletas"
          >
            Atletas
          </button>
          <button
            class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-ink-100"
            data-route="#/clubes"
          >
            Clubes
          </button>
        </nav>
        <div
          id="market-status"
          class="hidden sm:flex items-center gap-2 text-xs text-ink-500"
        >
          <span class="spinner"></span>
          <span>carregando mercado…</span>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- Recomendações -->
      <section data-view="recomendacoes" class="is-active">
        <div class="flex flex-wrap items-center gap-2 mb-4">
          <h1 class="text-xl font-bold">Recomendações</h1>
          <span class="chip" id="reco-rodada-chip" style="display: none"></span>
        </div>

        <div class="bg-white rounded-xl border border-ink-200 p-4 mb-4">
          <div class="flex flex-wrap gap-2 mb-3" id="reco-criterio-tabs">
            <button
              class="tab-btn px-3 py-1.5 rounded-lg text-sm border border-ink-200"
              data-criterio="custo_beneficio"
              aria-selected="true"
            >
              Custo-benefício
            </button>
            <button
              class="tab-btn px-3 py-1.5 rounded-lg text-sm border border-ink-200"
              data-criterio="destaques_rodada"
            >
              Destaques da rodada
            </button>
            <button
              class="tab-btn px-3 py-1.5 rounded-lg text-sm border border-ink-200"
              data-criterio="misto"
            >
              Misto
            </button>
            <button
              class="tab-btn px-3 py-1.5 rounded-lg text-sm border border-ink-200"
              data-criterio="confronto_hibrido"
            >
              Confronto híbrido
            </button>
            <button
              class="tab-btn px-3 py-1.5 rounded-lg text-sm border border-ink-200"
              data-criterio="valorizacao"
            >
              Valorização
            </button>
          </div>

          <p
            id="reco-criterio-descricao"
            class="text-xs text-ink-500 mb-4 leading-relaxed"
          ></p>

          <form
            id="reco-form"
            class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm"
          >
            <label class="flex flex-col gap-1">
              <span class="text-xs font-semibold text-ink-600">Posição</span>
              <select
                name="posicao_id"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              >
                <option value="">Todas</option>
                <option value="1">Goleiro</option>
                <option value="2">Lateral</option>
                <option value="3">Zagueiro</option>
                <option value="4">Meia</option>
                <option value="5">Atacante</option>
                <option value="6">Técnico</option>
              </select>
            </label>
            <label class="flex flex-col gap-1">
              <span class="text-xs font-semibold text-ink-600">Limite</span>
              <input
                name="limite"
                type="number"
                min="1"
                max="50"
                value="10"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="valorizacao"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600"
                >Preço máximo (C$)</span
              >
              <input
                name="preco_max"
                type="number"
                step="0.1"
                min="0"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
                placeholder="ex: 10"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="misto"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600"
                >Rodadas (histórico)</span
              >
              <input
                name="rodadas"
                type="number"
                min="1"
                max="20"
                value="5"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="confronto_hibrido"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600"
                >Janela curta</span
              >
              <input
                name="janela_curta"
                type="number"
                min="1"
                max="15"
                value="5"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="confronto_hibrido"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600"
                >Janela longa</span
              >
              <input
                name="janela_longa"
                type="number"
                min="1"
                max="30"
                value="10"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="confronto_hibrido"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600">Peso curta</span>
              <input
                name="peso_curta"
                type="number"
                step="0.05"
                min="0"
                max="1"
                value="0.7"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="confronto_hibrido"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600">Peso longa</span>
              <input
                name="peso_longa"
                type="number"
                step="0.05"
                min="0"
                max="1"
                value="0.3"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              />
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="destaques_rodada"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600">Fonte</span>
              <select
                name="fonte"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
              >
                <option value="pontuacao_cartola">Pontuação Cartola</option>
                <option value="pontuacao_calculada">Pontuação calculada</option>
              </select>
            </label>
            <label
              class="flex flex-col gap-1"
              data-show-for="destaques_rodada"
              style="display: none"
            >
              <span class="text-xs font-semibold text-ink-600"
                >Rodada (opcional)</span
              >
              <input
                name="rodada"
                type="number"
                min="1"
                max="38"
                class="border border-ink-200 rounded-lg px-2 py-1.5 bg-white"
                placeholder="atual"
              />
            </label>
            <div class="col-span-full flex justify-end items-end">
              <button
                type="submit"
                class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-4 py-2 rounded-lg"
              >
                Gerar recomendações
              </button>
            </div>
          </form>
        </div>

        <div id="reco-resultado" class="bg-white rounded-xl border border-ink-200 overflow-hidden">
          <div class="p-6 text-sm text-ink-400 text-center">
            Selecione um critério e clique em <b>Gerar recomendações</b>.
          </div>
        </div>
      </section>

      <!-- Atletas -->
      <section data-view="atletas">
        <h1 class="text-xl font-bold mb-4">Busca de atletas</h1>
        <div class="bg-white rounded-xl border border-ink-200 p-4 mb-4">
          <label class="flex flex-col gap-1">
            <span class="text-xs font-semibold text-ink-600">Nome / apelido</span>
            <input
              id="atleta-search"
              type="search"
              placeholder="ex: Hulk, Pedro, Arrascaeta…"
              class="border border-ink-200 rounded-lg px-3 py-2 bg-white"
              autocomplete="off"
            />
          </label>
        </div>
        <div id="atleta-resultado"></div>
      </section>

      <!-- Clubes -->
      <section data-view="clubes">
        <div class="flex items-end gap-3 flex-wrap mb-4">
          <h1 class="text-xl font-bold">Clubes</h1>
          <span id="clubes-contador" class="text-xs text-ink-400"></span>
        </div>
        <div class="bg-white rounded-xl border border-ink-200 p-4 mb-4">
          <label class="flex flex-col gap-1">
            <span class="text-xs font-semibold text-ink-600">Buscar clube</span>
            <input
              id="clube-search"
              type="search"
              placeholder="ex: Flamengo, FLA, palmeiras…"
              class="border border-ink-200 rounded-lg px-3 py-2 bg-white"
              autocomplete="off"
            />
          </label>
        </div>
        <div id="clubes-resultado" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
          <div class="col-span-full text-center text-sm text-ink-400 py-8">
            <span class="spinner"></span> carregando clubes…
          </div>
        </div>
      </section>
    </main>

    <!-- Modal genérico -->
    <div
      id="modal"
      class="fixed inset-0 bg-black/50 z-30 hidden items-start justify-center overflow-y-auto p-4"
    >
      <div
        class="bg-white rounded-xl max-w-3xl w-full shadow-xl mt-10"
        role="dialog"
        aria-modal="true"
      >
        <div
          class="flex items-center justify-between px-5 py-3 border-b border-ink-200"
        >
          <h2 id="modal-title" class="font-semibold"></h2>
          <button
            id="modal-close"
            class="text-ink-400 hover:text-ink-700 text-2xl leading-none"
            aria-label="Fechar"
          >
            ×
          </button>
        </div>
        <div id="modal-body" class="p-5"></div>
      </div>
    </div>

    <footer class="py-8 text-center text-xs text-ink-400">
      Corneteiro · consome a API Flask local em <code>/</code>
    </footer>

    <script src="/assets/app.js"></script>
  </body>
</html>
